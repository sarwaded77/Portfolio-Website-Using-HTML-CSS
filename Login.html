<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="login.css">
    <style>
        body{
            background-color: grey;   
        }

        form{
            border: 2px solid white;
            background-color: white;
            border-radius: 10px;
            padding-left: 50px;
            width: 30%;
            height: 450px;
            margin-left: 400px;
            margin-top: 100px;
    
        }

        form>h1{
            padding-left: 70px;
        }

        label{
            font-size: 20px;
            justify-content: left;
            font-weight: bold;
        }

        input{
            width: 60%;
            height: 30px;
            font-size: 18px;
            border: 2px solid black;
            border-radius: 5px;

        }

        button{
            width: 40%;
            height: 40px;
            font-size: 20px;
            text-decoration: none;
            background-color: blue;
            border: 1px solid blue;
            color: white;
            border-radius: 10px;
            font-weight: bold;
        }

        a{
            text-decoration: none;
            font-size: 20px;
            padding-bottom: 60px;
            color: purple;
    
        }       
    </style>
    
</head>
<body>
    <section>

        <form >
            <h1>Login Now</h1>
           
            <label for="name">Name</label><br>
            <input type="text" name="name" id="name" placeholder="Enter your name">

            <br><br>

            <label for="email">Email</label><br>
            <input type="text" name="email" id="email" placeholder="Enter your email">

            <br><br>

            <label for="password">Password</label><br>
            <input type="text" name="password" id="no" placeholder="Enter your password">
            
            <br><br>

            
            <a href="index.html">
                <button type="button" >Login</button>
            </a>
            
            

            <br><br>

            <a href="sign_up.html">Don't have an Account? <u>Sign Up Here!</u></a>
        </form>


    </section>
    
</body>
</html>
