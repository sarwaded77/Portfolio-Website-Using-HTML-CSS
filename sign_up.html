<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_up Form</title>
    
    <style>
        *{
             margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
            
        body{
            background-color: grey; 
            margin: 0;
            padding:20px;
        }

        form{
            border: 2px solid white;
            background-color: white;
            border-radius: 10px;
            padding-left: 50px;
            width: 30%;
            height: 550px;
            margin-left: 400px;
            margin-top: 100px;
        }

        form>h1{
            margin-left: 80px;
        }

        
        label{
            font-size: 20px;
            justify-content: left;
            font-weight: bold;
        }

        input{
            width: 60%;
            height: 30px;
            font-size: 18px;
            border: 2px solid black;
            border-radius: 5px;

        }

        button{
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-decoration: none;
            background-color:blue;
            color: white;
            border: 1px solid blue;
            border-radius: 10px;
            font-weight: bold;
        }

        a{
            text-decoration: none;
            font-size: 20px;
            padding-bottom: 60px;
            color: purple;
    
        }
        /* Mobile Screen  */

           @media (max-width: 600px) {
               body {
                   padding: 10px;
               }

            form {
                width: 100%;
                margin: 20px auto;
                padding: 25px;
            }

            form > h1 {
                font-size: 28px;
            }

            input {
                width: 100%;
            }

            button {
                width: 100%;
            }

            a {
                font-size: 16px;
            }
        }
    </style>
    
</head>
<body>
    <section>

        <form >
            <h1>Sign Up Now</h1>
           

            <br>

            <label for="email">Email</label><br>
            <input type="text" name="email" id="email" placeholder="Enter your email">

            <br><br>

            <label for="password">Password</label><br>
            <input type="text" name="password" id="no" placeholder="Enter your password">
            
            <br><br>

            <label for="first name">First Name</label><br>
            <input type="text" name="first name" id=" first name" placeholder="Enter your first name">

            <br><br>

            <label for="last name">Last Name</label><br>
            <input type="text" name="last name" id="last name" placeholder="Enter your  last name">

            <br><br>

            <a href="index.html">
                <button type="button" >Sign Up</button>
            </a>
            
            

            <br><br>

            <a href="Login.html">Already have an Account? <u>Login Here!</u></a>
        </form>


    </section>
    
</body>
</html>
